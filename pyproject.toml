[project]
name = "proyecto-storybook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "juanmata23", email = "juandiegomatallana23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.46.1",
    "diffusers>=0.43.0",
    "huggingface-hub>=2.4.0",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "transformers>=5.22.2",
]

[project.scripts]
proyecto-storybook = "proyecto_storybook:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
